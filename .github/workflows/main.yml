name: Build Portable Windows (Debug Version)
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # 如果有v5建议换成v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Cores
        run: pnpm run prebuild

      - name: Build Portable
        run: pnpm run portable

      # 【关键调试步骤】查看实际生成了哪些文件，防止路径错误
      - name: List files for debugging
        run: |
          echo "Checking root directory:"
          dir
          echo "Checking publish directory:"
          if (Test-Path publish) { dir publish }
          echo "Checking release directory:"
          dir src-tauri/target/release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Portable
          path: |
            publish/*
            src-tauri/target/release/clash-verge*.exe
          if-no-files-found: error
