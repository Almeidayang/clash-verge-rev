# .github/workflows/portable.yml（新建）
name: Build Portable

env:
 TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }} 
 TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

on:
  workflow_dispatch:      # 手动触发
  push:
    tags: ['v*']         # 或者 tag 触发

jobs:
  build-portable:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc] # target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: pnpm install
      - run: pnpm run prebuild
       # 构建 Tauri（必须启用 portable）
      - run: pnpm build
      
      # 生成 portable ZIP（依赖 portable bundle）
      - run: pnpm portable-fixed-webview2 ${{ matrix.target }}   # 或 pnpm portable

      # 上传 ZIP artifact（你能在 Actions 页面看到）
      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Clash.Verge_portable_${{ matrix.target }}
          path: src-tauri/target/release/bundle/portable/*.zip
