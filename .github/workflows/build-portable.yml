name: Build Portable Windows (v2026 Fixed)

on:
  workflow_dispatch:

env:
  # 强制让过时的 Action 运行在 Node 24 上
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 禁用 Husky 钩子以加速构建
  HUSKY: 0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 【修复关键】不指定 version，Action 会自动从 package.json 读取 10.32.1
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        # 使用 --no-frozen-lockfile 避免因为版本微调导致的安装失败
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Cores
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Build Portable
        # 这里建议尝试使用带 WebView2 的版本，对“不被杀毒软件拦截”更有帮助
        # 如果报错，请改回 pnpm run portable x86_64-pc-windows-msvc
        run: pnpm run portable-fixed-webview2 x86_64-pc-windows-msvc
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: List Files for Debugging
        shell: pwsh
        run: |
          Write-Host "--- Root Directory ---"
          ls
          if (Test-Path publish) { 
            Write-Host "--- Publish Directory Content ---"
            ls publish 
          } else {
            Write-Host "!!! publish directory not found !!!"
            ls src-tauri/target/x86_64-pc-windows-msvc/release/
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Portable-2026
          path: |
            publish/*.zip
            publish/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
