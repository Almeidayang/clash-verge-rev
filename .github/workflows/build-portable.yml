name: Build Portable Windows (Final Fix)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HUSKY: 0
  # 提高 Node 内存限制，防止打包时 OOM
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 不写版本，自动读取 package.json 里的 10.32.1
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        # 使用 --no-frozen-lockfile 兼容 pnpm 10 的严格校验
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild Cores
        # 很多版本不支持参数，直接运行默认 prebuild
        run: pnpm run prebuild

      - name: Build Portable
        # 核心修复：先尝试最通用的 portable 命令
        # 如果这个依然报错，请检查 package.json 里的 scripts 部分
        run: pnpm run portable
        env:
          # 告诉 Tauri 不要生成安装包，只生成二进制
          TAURI_SKIP_MSI_STEP: true 

      - name: List Files for Debugging
        if: always() # 即使失败也运行，方便看文件到底在哪
        shell: pwsh
        run: |
          echo "=== Root Directory ==="
          ls
          echo "=== src-tauri Directory ==="
          ls src-tauri
          if (Test-Path publish) { 
            echo "=== Publish Folder Found ==="
            ls publish 
          }
          if (Test-Path src-tauri/target/release) {
            echo "=== Release Folder Found ==="
            ls src-tauri/target/release
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clash-Verge-Portable-2026
          path: |
            publish/*
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
          if-no-files-found: warn
