# ============================================================
# clash-verge-rev — Windows Portable 构建 Workflow
# 放置路径：.github/workflows/build-portable.yml
#
# 触发方式：
#   1. 推送 v* 格式的 tag（如 git tag v2.2.4 && git push --tags）
#   2. 在 Actions 页面手动点击 "Run workflow"
#
# 产物：
#   GitHub Release 页面会自动创建（或更新），包含：
#   - Clash.Verge_x64_portable.zip   （x64 Portable）
#   - Clash.Verge_arm64_portable.zip （ARM64 Portable，可按需关闭）
#
# Secrets 配置（Settings → Secrets and variables → Actions）：
#   必须：
#     GITHUB_TOKEN          — Actions 自动提供，无需手动创建
#   可选（代码签名，用于消除 SmartScreen 警告）：
#     TAURI_SIGNING_PRIVATE_KEY          — tauri-action 更新签名私钥
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD — 对应密码
#     PFX_BASE64             — OV/EV 证书的 base64 内容（用于 signtool）
#     PFX_PASSWORD           — 证书密码
# ============================================================

name: Build Portable (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 tag 名称（如 v2.2.4），留空则使用 package.json 版本'
        required: false
        default: ''

permissions:
  contents: write   # 允许创建 Release 和上传文件

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: 构建 Windows Portable（矩阵同时跑 x64 和 arm64）
  # ──────────────────────────────────────────────────────────
  build-portable:
    name: Build Portable (${{ matrix.target }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_label: x64
          - target: aarch64-pc-windows-msvc
            arch_label: arm64

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 安装 pnpm ─────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # ── 3. 安装 Node.js 22（与官方一致）────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── 4. 安装 Rust stable + 目标平台 ──────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── 5. （arm64 专用）安装 LLVM，ring crate 需要 clang ─
      - name: Install LLVM (arm64 only)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: choco install llvm -y
        shell: pwsh

      - name: Set LLVM env (arm64 only)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          echo "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          echo "PATH=$llvm;$env:PATH" >> $env:GITHUB_ENV
        shell: pwsh

      # ── 6. 安装 GNU patch（prebuild 脚本打补丁需要）────
      - name: Install GNU patch
        run: choco install patch -y
        shell: pwsh

      # ── 7. 缓存 Rust 编译产物（加速后续构建）────────────
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # ── 8. 安装 Node 依赖 ────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── 9. Prebuild：下载 mihomo 核心、sysproxy、geo 数据库等 ──
      #    GITHUB_TOKEN 用于 GitHub API 下载，避免匿名限速
      - name: Prebuild (download external resources)
        run: pnpm prebuild ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. 读取版本号（供后续命名使用）─────────────────
      - name: Read version
        id: version
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          # 确定 tag 名称
          if ("${{ github.event.inputs.tag_name }}" -ne "") {
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $env:GITHUB_ENV
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            echo "TAG_NAME=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            echo "TAG_NAME=v$ver" >> $env:GITHUB_ENV
          }
        shell: pwsh

      # ── 11. Tauri Build ───────────────────────────────────
      #    使用 tauri-apps/tauri-action，它会：
      #      a) 构建前端（pnpm build）
      #      b) cargo build --release
      #      c) 用 tauri bundler 打 NSIS installer
      #    Portable 需要 NSIS 产物，所以先完整跑一遍
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名（可选，没有 secret 时留空不影响编译）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 不在这一步创建 Release，由后面的步骤统一处理
          tagName: ''
          releaseName: ''
          args: --target ${{ matrix.target }}

      # ── 12. （可选）对 exe 进行代码签名 ─────────────────
      #    有 PFX_BASE64 / PFX_PASSWORD secret 时才执行
      #    签名后 SmartScreen 会逐步积累信誉；EV 证书可立即消除告警
      #    注意：if 条件里无法直接引用 secrets，改用 env 变量判断
      - name: Sign executables (optional)
        if: env.PFX_BASE64 != ''
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          # 解码证书
          $pfxBytes = [Convert]::FromBase64String("$env:PFX_BASE64")
          $pfxPath  = "$env:TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # 找到所有待签名的 exe（包括 mihomo sidecar）
          $bundleDir = "src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
          $exeFiles  = Get-ChildItem "$bundleDir\*.exe" -Recurse
          $sidecarExe = "src-tauri\target\${{ matrix.target }}\release\verge-mihomo-*.exe"

          foreach ($f in $exeFiles) {
            signtool sign /f $pfxPath /p "$env:PFX_PASSWORD" `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
              "$($f.FullName)"
            Write-Host "Signed: $($f.FullName)"
          }

          Remove-Item $pfxPath -Force
        shell: pwsh

      # ── 13. 打包 Portable ZIP ────────────────────────────
      #    官方 scripts/portable.mjs 做的事：
      #      1. 从 NSIS installer 解包文件
      #      2. 创建 .config/PORTABLE 标志文件
      #      3. 压成 ZIP
      - name: Package Portable
        run: pnpm portable ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 14. 找到并重命名 ZIP 产物 ─────────────────────────
      - name: Locate and rename portable zip
        id: locate
        run: |
          $bundleDir = "src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
          $zip = Get-ChildItem "$bundleDir\*.zip" | Select-Object -First 1
          if (-not $zip) {
            # 部分版本输出路径略有不同，再找一次
            $zip = Get-ChildItem "src-tauri\target\${{ matrix.target }}\release\bundle\*.zip" | Select-Object -First 1
          }
          if (-not $zip) { throw "Portable ZIP not found!" }

          $dest = "Clash.Verge_${{ env.VERSION }}_${{ matrix.arch_label }}_portable.zip"
          Copy-Item $zip.FullName $dest
          echo "ZIP_PATH=$dest" >> $env:GITHUB_ENV
          Write-Host "Portable zip: $dest"
        shell: pwsh

      # ── 15. 上传到 GitHub Release ─────────────────────────
      #    若 Release 不存在会自动创建；tag 已存在时会追加文件
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Clash Verge Rev ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Clash Verge Rev ${{ env.TAG_NAME }} — Portable

            ### 下载说明
            | 文件 | 适用系统 |
            |---|---|
            | `*_x64_portable.zip` | Windows 10/11 64位（主流） |
            | `*_arm64_portable.zip` | Windows ARM64 设备 |

            ### Portable 使用方式
            1. 解压 ZIP 到任意目录
            2. 运行 `Clash Verge.exe`
            3. 所有配置保存在同目录 `.config\` 下，可随目录迁移

            > 首次运行若出现 SmartScreen 警告，点击"更多信息" → "仍要运行"即可。
          files: |
            ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 16. 同时上传为 Actions Artifact（可选，方便调试）─
      - name: Upload as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch_label }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
